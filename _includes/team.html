<!-- ============================= -->
<!--   TEAM SECTION (DS-CHANGES)   -->
<!-- ============================= -->

<section id="team" style="background-color: white;">
  <div class="container">
    <div class="text-center">
      <h2 class="section-heading text-uppercase">Project Team</h2>
      <h3 class="section-subheading text-muted">Meet the researchers behind DS-CHANGES</h3>
    </div>

    <!-- ================== -->
    <!--  TEAM MEMBERS      -->
    <!-- ================== -->
    <div class="row">
      {% for member in site.data.team.members %}
      <div class="col-lg-4 col-sm-6 mb-5">
        <div class="team-member text-center">
          <img class="mx-auto rounded-circle" src="{{ member.image }}" alt="{{ member.name }}" style="width:180px; height:180px; object-fit:cover;">
          <h4 class="mt-3">{{ member.name }}</h4>
          <p class="text-muted" style="font-weight: 600;">{{ member.role }}</p>
          <p class="small text-muted">{{ member.bio }}</p>
          <div class="mt-2">
            {% if member.email %}
            <a href="mailto:{{ member.email }}" class="mx-1"><i class="fas fa-envelope"></i></a>
            {% endif %}
            {% if member.linkedin %}
            <a href="{{ member.linkedin }}" target="_blank" class="mx-1"><i class="fab fa-linkedin"></i></a>
            {% endif %}
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

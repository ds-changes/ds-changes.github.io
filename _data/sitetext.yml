        image: assets/img/timeline/kick-off_resized.jpg

      - title: "Workshop @Università di Milano-Bicocca"
        year: "October 2025"
        text: "On October 30, 2025, the DS-CHANGES project will be presented during the workshop “Statistica e Data Science per l’Agricoltura e l’Ambiente” at the University of Milano-Bicocca. The event, organized within the SCARFACE research project, focuses on the application of data science to agricultural and environmental systems in the Po Valley."
        image: assets/img/timeline/bicocca_evento.jpg

